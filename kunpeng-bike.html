  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 16px;
      box-sizing: border-box;
      background: radial-gradient(circle at 50% 30%, #075985, #082f49 68%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .stage {
      width: min(1000px, 96vw);
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
      background: #e0f2fe;
    }
    svg text {
      font-family: KaiTi, STKaiti, "楷体", "Microsoft YaHei", serif;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 8px 22px;
      background: #be123c;
      color: #fff;
      letter-spacing: 0.24em;
      font: 15px/1.4 "Microsoft YaHei", sans-serif;
      cursor: pointer;
    }
    button:hover { background: #9f1239; }
    button:focus-visible {
      outline: 3px solid #fde68a;
      outline-offset: 3px;
    }
    .hint {
      margin: 0;
      color: #bae6fd;
      font-size: 13px;
      letter-spacing: 0.12em;
    }
  </style>
</head>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const CRANK_CX = 445;
    const CRANK_CY = 356;
    const CRANK_R = 32;
    const HIP_NEAR = { x: 448, y: 302 };
    const HIP_FAR = { x: 412, y: 294 };
    const WHEEL_REAR = { cx: 300, cy: 392 };
    const WHEEL_FRONT = { cx: 590, cy: 392 };

    const $ = (id) => document.getElementById(id);

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
      if (parent) parent.appendChild(node);
      return node;
    }

    function repeatTile(id, width) {
      const tile = $(id);
      const copy = tile.cloneNode(true);
      copy.removeAttribute("id");
      copy.setAttribute("transform", "translate(" + width + " 0)");
      tile.parentNode.appendChild(copy);
    }

    function buildWheel(group, cx, cy, withCog) {
      el("circle", { cx, cy, r: 40, fill: "#f8fafc" }, group);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        el("line", {
          x1: cx,
          y1: cy,
          x2: cx + Math.cos(a) * 36,
          y2: cy + Math.sin(a) * 36,
          stroke: "#a8a29e",
          "stroke-width": 1.6
        }, group);
      }
      el("circle", { cx, cy, r: 33, fill: "none", stroke: "#e7e5e4", "stroke-width": 2 }, group);
      el("circle", { cx, cy, r: 40, fill: "none", stroke: "#1c1917", "stroke-width": 8 }, group);
      if (withCog) {
        el("circle", { cx, cy, r: 12, fill: "none", stroke: "#292524", "stroke-width": 4 }, group);
      }
      el("circle", { cx, cy, r: 7, fill: "#be123c", stroke: "#fbbf24", "stroke-width": 2 }, group);
      el("circle", { cx: cx + 30, cy, r: 3.5, fill: "#ef4444" }, group);
    }

    function buildCrank(group) {
      el("circle", { r: 16, fill: "#44403c" }, group);
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        el("line", {
          x1: Math.cos(a) * 14,
          y1: Math.sin(a) * 14,
          x2: Math.cos(a) * 22,
          y2: Math.sin(a) * 22,
          stroke: "#292524",
          "stroke-width": 3,
          "stroke-linecap": "round"
        }, group);
      }
      el("line", {
        x1: -CRANK_R,
        y1: 0,
        x2: CRANK_R,
        y2: 0,
        stroke: "#1c1917",
        "stroke-width": 6,
        "stroke-linecap": "round"
      }, group);
      el("circle", { r: 6, fill: "#fbbf24", stroke: "#b45309", "stroke-width": 2 }, group);
    }

    function buildScales(group) {
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 5; col++) {
          const x = 318 + col * 26 + (row % 2) * 12;
          const y = 196 + row * 20;
          el("path", { d: "M " + x + " " + y + " q 11 -12 22 0" }, group);
        }
      }
    }

    function buildWaves(group) {
      const specs = [
        { y: 366, amp: 7, step: 50, color: "rgba(255,255,255,.5)", width: 2 },
        { y: 392, amp: 8, step: 25, color: "rgba(255,255,255,.38)", width: 2.4 },
        { y: 416, amp: 6, step: 50, color: "rgba(255,255,255,.62)", width: 3 }
      ];
      for (const spec of specs) {
        let d = "M 0 " + spec.y;
        const count = 1000 / spec.step;
        for (let i = 0; i < count; i++) {
          const amp = i % 2 === 0 ? -spec.amp : spec.amp;
          d += " q " + (spec.step / 2) + " " + amp + ", " + spec.step + " 0";
        }
        el("path", {
          d,
          fill: "none",
          stroke: spec.color,
          "stroke-width": spec.width,
          "stroke-linecap": "round"
        }, group);
      }
    }

    function buildGrass(group) {
      for (let x = 0; x < 1000; x += 34) {
        const h = 9 + ((x * 5) % 12);
        const d = "M " + x + " 488 c 4 " + (-h) + ", 9 " + (-h + 2) + ", 13 0 c 3 " + (-(h + 6)) + ", 11 " + (-(h + 3)) + ", 15 0 c 4 " + (-h) + ", 8 " + (-h) + ", 12 0";
        el("path", {
          d,
          fill: "none",
          stroke: x % 68 === 0 ? "#3f6212" : "#4d7c0f",
          "stroke-width": 2,
          "stroke-linecap": "round"
        }, group);
        if (x % 102 === 0) {
          el("circle", {
            cx: x + 18,
            cy: 486 - h,
            r: 3,
            fill: x % 204 === 0 ? "#fb7185" : "#facc15"
          }, group);
        }
      }
    }

    function buildCloud(scale) {
      const group = el("g", {});
      const puffs = [[0, 10, 26], [24, 0, 20], [48, 12, 24], [22, 16, 18]];
      for (const [x, y, r] of puffs) {
        el("ellipse", {
          cx: x * scale,
          cy: y * scale,
          rx: r * scale,
          ry: r * 0.68 * scale,
          fill: "#ffffff"
        }, group);
      }
      return group;
    }

    function buildRays(group) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        el("line", {
          x1: Math.cos(a) * 46,
          y1: Math.sin(a) * 46,
          x2: Math.cos(a) * 74,
          y2: Math.sin(a) * 74,
          stroke: "#fde68a",
          "stroke-width": 4,
          "stroke-linecap": "round"
        }, group);
      }
    }

    function kneeOf(hip, foot, bendBias) {
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ang = Math.atan2(dy, dx);
      const bend = Math.max(8, Math.min(26, (96 - dist) * 0.38)) + bendBias;
      const options = [ang + Math.PI / 2, ang - Math.PI / 2].map((a) => {
        const knee = {
          x: hip.x + dx * 0.48 + Math.cos(a) * bend,
          y: hip.y + dy * 0.48 + Math.sin(a) * bend
        };
        if (knee.y < hip.y + 18) knee.y = hip.y + 18;
        return knee;
      });
      options.sort((a, b) => b.x - a.x);
      return options[0];
    }

    function footPoint(angle) {
      return {
        x: CRANK_CX + Math.cos(angle) * CRANK_R,
        y: CRANK_CY + Math.sin(angle) * CRANK_R
      };
    }

    function blinkScale(time) {
      const phase = time % 3.8;
      if (phase < 0.08) return 1 - (phase / 0.08) * 0.86;
      if (phase < 0.16) return 0.14 + ((phase - 0.08) / 0.08) * 0.86;
      return 1;
    }

    function loopCloudX(start, speed) {
      const span = 1400;
      const moved = (elapsed * speed) % span;
      let x = start - moved;
      if (x < -220) x += span;
      return x;
    }

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let playing = !reduceMotion;
    let elapsed = 0.2;
    let last = 0;

    const clouds = [
      { x0: 260, y: 46, speed: 18, scale: 0.72 },
      { x0: 520, y: 92, speed: 28, scale: 1 },
      { x0: 860, y: 38, speed: 16, scale: 0.84 },
      { x0: 1080, y: 108, speed: 34, scale: 1.12 },
      { x0: 80, y: 128, speed: 22, scale: 0.62 }
    ];

    function render(time) {
      const crankDeg = time * 300 - 35;
      const crankRad = crankDeg * Math.PI / 180;
      const bob = -Math.cos(crankRad * 2) * 3.4;
      const ground = (time * 170) % 1000;

      $("wheelRear").setAttribute("transform", "rotate(" + (time * 560) + " " + WHEEL_REAR.cx + " " + WHEEL_REAR.cy + ")");
      $("wheelFront").setAttribute("transform", "rotate(" + (time * 560) + " " + WHEEL_FRONT.cx + " " + WHEEL_FRONT.cy + ")");
      $("crank").setAttribute("transform", "translate(" + CRANK_CX + " " + CRANK_CY + ") rotate(" + crankDeg + ")");
      $("chain").style.strokeDashoffset = String(time * 120);
      $("birdUpper").setAttribute("transform", "translate(0 " + bob + ")");
      $("shadow").setAttribute("transform", "translate(450 440) scale(" + (1 + bob * 0.018) + " 1)");

      const nearFoot = footPoint(crankRad);
      const farFoot = footPoint(crankRad + Math.PI);
      const hipN = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
      const hipF = { x: HIP_FAR.x, y: HIP_FAR.y + bob };
      const kneeN = kneeOf(hipN, nearFoot, 0);
      const kneeF = kneeOf(hipF, farFoot, -8);

      $("legNear").setAttribute("d", "M " + hipN.x + " " + hipN.y + " L " + kneeN.x + " " + kneeN.y + " L " + nearFoot.x + " " + nearFoot.y);
      $("legFar").setAttribute("d", "M " + hipF.x + " " + hipF.y + " L " + kneeF.x + " " + kneeF.y + " L " + farFoot.x + " " + farFoot.y);
      $("kneeNear").setAttribute("cx", kneeN.x);
      $("kneeNear").setAttribute("cy", kneeN.y);
      $("kneeFar").setAttribute("cx", kneeF.x);
      $("kneeFar").setAttribute("cy", kneeF.y);
      $("hipNear").setAttribute("cx", hipN.x);
      $("hipNear").setAttribute("cy", hipN.y);
      $("hipFar").setAttribute("cx", hipF.x);
      $("hipFar").setAttribute("cy", hipF.y);
      $("footNear").setAttribute("transform", "translate(" + nearFoot.x + " " + nearFoot.y + ")");
      $("footFar").setAttribute("transform", "translate(" + farFoot.x + " " + farFoot.y + ") scale(0.86)");

      const flap = Math.sin(time * 2.3) * 11;
      $("nearWing").setAttribute("transform", "rotate(" + flap + " 424 176)");
      $("farWing").setAttribute("transform", "rotate(" + (flap * 0.8) + " 400 180)");
      $("tail").setAttribute("transform", "rotate(" + (Math.sin(time * 3.3) * 8) + " 308 212)");
      $("dorsal").setAttribute("transform", "rotate(" + (Math.sin(time * 2.1) * 3.5) + " 370 150)");
      $("eye").setAttribute("transform", "translate(626 150) scale(1 " + blinkScale(time) + ")");
      $("tassel").setAttribute("transform", "translate(642 218) rotate(" + (Math.sin(time * 6.5) * 10) + ")");

      $("groundDecor").setAttribute("transform", "translate(" + (-ground) + " 0)");
      $("dashes").style.strokeDashoffset = String(time * 170);
      $("waveLayer").setAttribute("transform", "translate(" + (-((time * 62) % 1000)) + " 0)");
      $("nearMount").setAttribute("transform", "translate(" + (-((time * 28) % 1000)) + " 0)");
      $("farMount").setAttribute("transform", "translate(" + (-((time * 12) % 1000)) + " 0)");
      $("sunRays").setAttribute("transform", "translate(790 68) rotate(" + (time * 10) + ")");
      $("glint").setAttribute("rx", String(12 + Math.sin(time * 2.2) * 5));
      $("glint").setAttribute("opacity", String(0.32 + Math.sin(time * 2.2) * 0.12));

      clouds.forEach((cloud) => {
        cloud.el.setAttribute("transform", "translate(" + loopCloudX(cloud.x0, cloud.speed) + " " + cloud.y + ") scale(" + cloud.scale + ")");
      });
    }

    function frame(now) {
      if (!last) last = now;
      const dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      if (playing) elapsed += dt;
      render(elapsed);
      requestAnimationFrame(frame);
    }

    function toggle() {
      playing = !playing;
      $("toggle").textContent = playing ? "暂停" : "播放";
    }

    $("toggle").addEventListener("click", toggle);
    document.addEventListener("keydown", (event) => {
      if (event.code !== "Space") return;
      if (event.target && event.target.tagName === "BUTTON") return;
      event.preventDefault();
      toggle();
    });

    buildWheel($("wheelRear"), WHEEL_REAR.cx, WHEEL_REAR.cy, true);
    buildWheel($("wheelFront"), WHEEL_FRONT.cx, WHEEL_FRONT.cy, false);
    buildCrank($("crank"));
    buildScales($("scales"));
    buildWaves($("waveTile"));
    buildGrass($("groundTile"));
    buildRays($("sunRays"));
    repeatTile("waveTile", 1000);
    repeatTile("groundTile", 1000);
    repeatTile("farTile", 1000);
    repeatTile("nearTile", 1000);

    const cloudLayer = $("cloudLayer");
    clouds.forEach((cloud) => {
      cloud.el = buildCloud(1);
      cloudLayer.appendChild(cloud.el);
    });

    if (reduceMotion) $("toggle").textContent = "播放";
    render(elapsed);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
